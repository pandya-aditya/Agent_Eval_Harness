services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: tracebench_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tracebench_dev"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
